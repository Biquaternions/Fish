name: Build 26.2
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci skip]')"
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Create MojmapPaperclipJar
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Prepare release notes and artifacts
        run: |
          chmod +x ./scripts/prepareRelease.sh
          ./scripts/prepareRelease.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

      - name: Upload Fish
        uses: actions/upload-artifact@main
        with:
          name: Fish 26.2
          path: ./fish-server/build/libs/fish-paperclip-*.jar

      - name: Release Fish
        uses: softprops/action-gh-release@master
        with:
          name: "🐟 Fish 26.2 (Build ${{ env.BUILD_NUMBER }})"
          tag_name: "ver-26.2"
          files: |
            ./fish-server/build/libs/fish-paperclip-*.jar
            ./fish-api/build/libs/fish-api-*.jar
          body_path: "./RELEASE.md"
          token: "${{ secrets.GITHUB_TOKEN }}"
          target_commitish: "${{ github.sha }}"
          draft: false
          prerelease: false

      - name: Publish Fish Version
        uses: fjogeleit/http-request-action@v1
        with:
          url: https://version.serlith.net/submit
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json", "Authorization": "${{ secrets.VERSION_TOKEN }}", "Server-Software": "Fish"}'
          data: '{ "software": "Fish", "version": "26.2", "build": ${{ env.BUILD_NUMBER }} }'
